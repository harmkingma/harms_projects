# -----------------------------------------------------------------------------
# Automations
# -----------------------------------------------------------------------------
automation:
  # input_number has no persistent default: without "initial" it starts at its
  # minimum, with "initial" every restart overwrites the user's value.
  - id: hp_initialise_settings
    alias: "Heat Pump Monitor: initialise settings"
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: automation_reloaded
    conditions:
      - condition: state
        entity_id: input_boolean.hp_initialised
        state: "off"
    actions:
      - action: input_number.set_value
        target:
          entity_id: input_number.hp_room_target
        data:
          value: 21
      - action: input_number.set_value
        target:
          entity_id: input_number.hp_curve_min_hours
        data:
          value: 12
      - action: input_boolean.turn_on
        target:
          entity_id:
            - input_boolean.hp_alerts_enabled
            - input_boolean.hp_initialised

  # Persistent notifications are raised and cleared by the same condition, so
  # the sidebar only shows problems that are still present.
  - id: hp_monitor_alerts
    alias: "Heat Pump Monitor: alerts"
    mode: queued
    triggers:
      - trigger: state
        id: offline
        entity_id: sensor.bridge0_sensors_temperature_r2t_leaving_water
        to: unavailable
        for: "00:15:00"
      - trigger: state
        id: online
        entity_id: sensor.bridge0_sensors_temperature_r2t_leaving_water
        from: unavailable
      - trigger: state
        id: error
        entity_id:
          - sensor.bridge0_mode_errorcode1
          - sensor.bridge0_mode_errorcode2
          - sensor.bridge0_mode_errorsubcode
        to: ~
      - trigger: state
        id: control
        entity_id:
          - switch.bridge0_bridge_control_function
          - switch.bridge0_bridge_counter_request_function
        not_to:
          - unavailable
          - unknown
        for: "00:05:00"
    actions:
      - choose:
          - conditions:
              - condition: trigger
                id: offline
              - condition: state
                entity_id: input_boolean.hp_alerts_enabled
                state: "on"
            sequence:
              - action: persistent_notification.create
                data:
                  notification_id: hp_bridge_offline
                  title: P1P2MQTT bridge offline
                  message: >-
                    The heat pump has not reported a leaving water temperature for
                    15 minutes. Check the P1P2MQTT bridge and the MQTT broker.
          - conditions:
              - condition: trigger
                id: online
            sequence:
              - action: persistent_notification.dismiss
                data:
                  notification_id: hp_bridge_offline
          - conditions:
              - condition: trigger
                id: error
            sequence:
              - if:
                  - condition: template
                    value_template: >-
                      {{ ['sensor.bridge0_mode_errorcode1', 'sensor.bridge0_mode_errorcode2',
                          'sensor.bridge0_mode_errorsubcode'] | map('states')
                         | reject('in', ['0x00', 'unknown', 'unavailable']) | list | count > 0 }}
                  - condition: state
                    entity_id: input_boolean.hp_alerts_enabled
                    state: "on"
                then:
                  - action: persistent_notification.create
                    data:
                      notification_id: hp_daikin_error
                      title: Daikin heat pump error
                      message: >-
                        Error codes {{ states('sensor.bridge0_mode_errorcode1') }} /
                        {{ states('sensor.bridge0_mode_errorcode2') }}, sub code
                        {{ states('sensor.bridge0_mode_errorsubcode') }}. Check the
                        error on the Daikin room thermostat.
                else:
                  - action: persistent_notification.dismiss
                    data:
                      notification_id: hp_daikin_error
          - conditions:
              - condition: trigger
                id: control
            sequence:
              - if:
                  - condition: state
                    entity_id:
                      - switch.bridge0_bridge_control_function
                      - switch.bridge0_bridge_counter_request_function
                    state: "on"
                then:
                  - action: persistent_notification.dismiss
                    data:
                      notification_id: hp_bridge_control_off
                else:
                  - condition: state
                    entity_id: input_boolean.hp_alerts_enabled
                    state: "on"
                  - action: persistent_notification.create
                    data:
                      notification_id: hp_bridge_control_off
                      title: P1P2MQTT bridge function switched off
                      message: >-
                        Control_Function is {{ states('switch.bridge0_bridge_control_function') }}
                        and Counter_Request_Function is
                        {{ states('switch.bridge0_bridge_counter_request_function') }}.
                        The bridge switches these off itself after too many bus errors
                        (Error_Budget). Without them the curve settings and the Daikin
                        counters stop updating. Switch them on again under device
                        bridge0_Bridge.
