# =============================================================================
# Home Battery Package - virtual home battery, fixed vs dynamic contract, 2029
# =============================================================================
# Read-only analysis: it never controls a device. READS these entities:
#   sensor.p1_meter_energy_import        HomeWizard P1, kWh total (all tariffs)
#   sensor.p1_meter_energy_export        HomeWizard P1, kWh total
#   sensor.p1_meter_power                HomeWizard P1, W, negative = export
#   sensor.steca_inverter_ac_power       solar production, W
#   sensor.gas_meter_gas                 HomeWizard gas, m3 total
#   sensor.energyzero_today_energy_current_hour_price   EnergyZero, market price incl. VAT
#   sensor.energyzero_today_gas_current_hour_price      EnergyZero, gas market price incl. VAT
# and, only for the consumption breakdown:
#   sensor.airco_masterbedroom_energy, sensor.airco_slaapkamer_2_energy   airco.yaml
#   sensor.bathroom_group_power                                          bathroom_radiator.yaml
#   sensor.life_the_universe_and_everything_charge_energy_added          Tesla Fleet
# Find-and-replace here if yours differ. Requires a Home Assistant version whose
# energyzero.get_energy_prices action has the "interval" option (2026.11 has it,
# 2026.2 does not).
#
# PRICES
# Install the EnergyZero integration (Settings > Devices & services, no account
# needed) and set its electricity interval to Quarter-hourly. Every 15 minutes
# sensor.hb_electricity_prices stores today's and (from about 13:00) tomorrow's
# quarter-hour market prices incl. VAT. All-in prices:
#   dynamic   market + markup + energy tax; export = market (excl. VAT unless
#             "Dynamic Export Incl. VAT") - feed-in fee
#   fixed     your fixed all-in price; export = feed-in compensation - feed-in
#             costs (net metering ends 1 Jan 2027, so no netting any more)
#   2029      + an assumed time-dependent network tariff: "Grid Rate" x the hourly
#             weight (winter Oct-Mar / summer Apr-Sep profiles, ACM draft
#             codebesluit of 8 Oct 2026). Export carries no network tariff. The
#             fixed network part drops ("Grid Fixed Change", EUR/year), so 2029
#             totals are comparable with 2027 ones. The network costs that stay
#             the same in every scenario are left out of all totals.
#
# VIRTUAL BATTERIES
# Every minute, the measured import/export of that minute (P1 counters) is
# replayed through one virtual battery per tariff (fixed 2027, dynamic 2027,
# fixed 2029, dynamic 2029), all with the same capacity/power/efficiency:
#   - surplus is always stored
#   - import is covered only when the current price is among the n most expensive
#     known quarter-hours, n = quarters the stored (+ expected solar) energy lasts
#     at the typical load (average import since tracking start)
#   - grid charging when the price is among the cheapest quarters needed to fill
#     up (leaving room for the expected solar surplus) and the value later (mean
#     of the most expensive quarters one full battery covers) x round trip beats
#     it by at least "Min. Spread"
#   - expected surplus = yesterday's export in the same hours (persistence)
#   - never discharges into the grid; standby consumption always from the grid
# With a flat price (fixed 2027) this is plain self-consumption. The Energy
# Analyzer add-on runs the same rules on the last year of hourly statistics
# (addon/energy_analyzer/energy_analyzer/model.py); keep both in step.
# The EV and the aircos are in the meter data, so a real battery would also
# cover (or compete with) them exactly as simulated; solar EV charging keeps
# priority because the battery only sees what the EV leaves for export.
#
# RUNNING TOTALS AND PROJECTION
# Trigger based sensors (state restored after restarts) add every minute's cost
# per scenario. The projection scales them to a year from 7 days on; it is
# season-biased (winter has no surplus), the add-on's year simulation is not.
# "Reset statistics" (script) restarts all totals and the tracking period.
# =============================================================================

input_boolean:
  hb_initialised:
    name: HB Initialised
    icon: mdi:check-decagram

  hb_dynamic_export_vat:
    name: HB Dynamic Export Incl. VAT
    icon: mdi:percent

