    mode: box
    icon: mdi:power-sleep
  hb_battery_min_spread:
    name: HB Battery Min. Spread (grid charging)
    min: 0
    max: 0.5
    step: 0.01
    unit_of_measurement: €/kWh
    mode: box
    icon: mdi:arrow-expand-vertical
  hb_battery_investment:
    name: HB Battery Investment
    min: 0
    max: 50000
    step: 50
