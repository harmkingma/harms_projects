# EV Charging Dashboard — complete raw configuration
#
# Setup: open your dashboard -> Edit Dashboard -> 3-dot menu -> Raw configuration editor
#        SELECT ALL existing content, DELETE it, then paste this entire file.
#
# New HA dashboards are created with a "sections" view. This file replaces that
# with a classic masonry view. If you prefer to keep the generated section view,
# paste only the "- title: EV Charging" block below as an extra entry under views:.

views:
  - title: EV Charging
    path: ev
    icon: mdi:ev-station
    cards:
      # -----------------------------------------------------------------------
      - type: entities
        title: Manual Control
        show_header_toggle: false
        entities:
          - entity: select.ev_charger_solar_charging_mode
            name: Charger Mode
          - entity: sensor.ev_charger_status_code_socket_1_2
            name: Charger Status
          - entity: switch.life_the_universe_and_everything_charge
            name: Charging
          - entity: binary_sensor.ev_car_plugged_in
            name: Car Plugged In
          - entity: binary_sensor.ev_charging_active
            name: Current Flowing
          - entity: sensor.ev_soc_effective
            name: Battery Level
          - entity: number.life_the_universe_and_everything_charge_limit
            name: Car Charge Limit

      # -----------------------------------------------------------------------
      - type: horizontal-stack
        cards:
          - type: button
            name: Start Max Power
            icon: mdi:flash
            entity: script.ev_start_max_power
            show_state: false
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.ev_start_max_power
          - type: button
            name: Stop Charging
            icon: mdi:stop-circle
            entity: script.ev_stop_charging
            show_state: false
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.ev_stop_charging
          - type: button
            name: Set Comfort
            icon: mdi:white-balance-sunny
            entity: script.ev_set_comfort
            show_state: false
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.ev_set_comfort
          - type: button
            name: Refresh Car
            icon: mdi:sleep-off
            entity: script.ev_refresh_car_data
            show_state: false
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.ev_refresh_car_data

      # -----------------------------------------------------------------------
      - type: entities
        title: Work Schedule
        show_header_toggle: false
        entities:
          - entity: input_boolean.work_monday
            name: Monday
          - entity: input_boolean.work_tuesday
            name: Tuesday
          - entity: input_boolean.work_wednesday
            name: Wednesday
          - entity: input_boolean.work_thursday
            name: Thursday
          - entity: input_boolean.work_friday
            name: Friday
          - type: divider
          - entity: input_datetime.work_departure_time
            name: Departure Time

      # -----------------------------------------------------------------------
      - type: entities
        title: Planned Trip
        show_header_toggle: false
        entities:
          - entity: input_boolean.ev_trip_planned
            name: Trip Planned
          - entity: input_datetime.ev_trip_departure
            name: Trip Departure
          - entity: input_number.ev_trip_target_soc
            name: Trip Target SOC
          - entity: binary_sensor.ev_trip_active
            name: Trip Active
          - type: divider
          - entity: sensor.ev_daytime_charge_ceiling
            name: Daytime Charge Ceiling
          - type: attribute
            entity: sensor.ev_next_departure
            attribute: source
            name: Governing Deadline
          - type: attribute
            entity: sensor.ev_required_soc
            attribute: reason
            name: Target Reason

      # -----------------------------------------------------------------------
      - type: entities
        title: Charging Parameters
        show_header_toggle: false
        entities:
          - entity: input_number.ev_roundtrip_consumption
            name: Roundtrip Consumption
          - entity: input_number.ev_regular_charge_limit
            name: Regular Charge Limit
          - entity: input_number.ev_min_safe_soc
            name: Min. Safe SOC
          - entity: input_number.ev_safety_min_duration_minutes
            name: Safety Charge Min. Duration
          - entity: input_number.ev_min_remaining_soc
            name: Min. Remaining SOC (work)
          - entity: input_number.ev_solar_min_off_minutes
            name: Solar Min. Off Time
          - entity: input_number.ev_solar_stop_max_power
            name: Solar Stop Max. Production
          - entity: input_number.ev_solar_stop_average_minutes
            name: Solar Stop Average Duration
          - entity: sensor.ev_solar_power_average
            name: Solar Production Average
          - type: divider
          - entity: input_datetime.ev_solar_window_start
            name: Solar Window Start
          - entity: input_datetime.ev_solar_window_end
            name: Solar Window End
          - entity: binary_sensor.ev_solar_window_active
            name: Solar Window Active
          - type: divider
          - entity: input_number.ev_max_power_charge_rate
            name: Max Power Charge Rate
          - entity: input_number.ev_ready_margin_hours
            name: Ready Margin
          - entity: input_number.ev_conditioning_interval_days
            name: Conditioning Interval

      # -----------------------------------------------------------------------
      - type: entities
        title: Charging Plan (read-only)
        show_header_toggle: false
        entities:
          - entity: sensor.ev_next_departure
            name: Next Departure
          - entity: sensor.ev_workday_run_length
            name: Consecutive Workdays
          - entity: sensor.ev_required_soc
            name: Required SOC
          - entity: sensor.ev_charge_deficit
            name: Deficit
          - entity: sensor.ev_night_charge_start
            name: Planned Night Start
          - type: divider
          - entity: binary_sensor.ev_conditioning_due
            name: 100% Conditioning Due
          - entity: input_datetime.ev_last_full_charge
            name: Last 100% Charge Start
          - entity: binary_sensor.ev_night_session_pending
            name: Night Session Pending

      # -----------------------------------------------------------------------
      - type: entities
        title: Session Flags (diagnostics)
        show_header_toggle: false
        entities:
          - entity: input_boolean.ev_solar_session
            name: Solar Session
          - entity: input_boolean.ev_night_session
            name: Night Session
          - entity: input_boolean.ev_safety_session
            name: Safety Session
          - entity: input_boolean.ev_max_power_override
            name: Max Power Override
          - entity: input_number.ev_night_target_soc
            name: Night Target SOC
          - entity: input_datetime.ev_charge_started
            name: Session Started
          - entity: input_datetime.ev_charge_stopped
            name: Session Stopped
          - entity: input_datetime.ev_session_deadline
            name: Session Deadline
          - type: divider
          - entity: sensor.life_the_universe_and_everything_battery_level
            name: Tesla SOC (live)
          - entity: input_number.ev_last_known_soc
            name: Cached SOC
          - entity: sensor.ev_soc_age
            name: SOC Age
          - entity: input_datetime.ev_last_soc_update
            name: SOC Last Updated

      # -----------------------------------------------------------------------
      # The P1 feed updates about once a second, so raw history over 24 h is
      # ~86k points per entity. These 5-minute statistics buckets are ~288 and
      # the recorder already maintains them.
      - type: statistics-graph
        title: Power
        days_to_show: 1
        period: 5minute
        chart_type: line
        stat_types:
          - mean
        entities:
          - entity: sensor.p1_meter_power
            name: Grid Power
          - entity: sensor.p1_power_mean_10min
            name: Grid Power (10 min mean)
          - entity: sensor.steca_inverter_ac_power
            name: Solar Production

      # -----------------------------------------------------------------------
      # SOC is a template sensor without long-term statistics, but it moves
      # slowly enough that raw history stays inexpensive.
      - type: history-graph
        title: Battery
        hours_to_show: 24
        entities:
          - entity: sensor.ev_soc_effective
            name: Battery
