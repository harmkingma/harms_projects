# Bathroom Radiator Dashboard — complete raw configuration
#
# Setup: open your dashboard -> Edit Dashboard -> 3-dot menu -> Raw configuration editor
#        SELECT ALL existing content, DELETE it, then paste this entire file.
#
# To add this as an extra view to an existing dashboard instead, paste only the
# "- title: Bathroom" block below as a new entry under the existing views:.

views:
  - title: Bathroom
    path: bathroom
    icon: mdi:shower
    cards:
      # -----------------------------------------------------------------------
      - type: conditional
        conditions:
          - condition: state
            entity: sensor.bathroom_group_power
            state:
              - unavailable
              - unknown
        card:
          type: markdown
          content: >
            ## <ha-icon icon="mdi:flash-alert"></ha-icon> Group power meter offline

            The Shelly EM on the radiator/oven group is not reporting.
            The radiator is **held off** until it returns.

      # -----------------------------------------------------------------------
      - type: thermostat
        entity: climate.badkamer_radiator
        name: Badkamer Radiator

      # -----------------------------------------------------------------------
      - type: entities
        title: Session Status
        show_header_toggle: false
        entities:
          - entity: sensor.bathroom_shower_phase
            name: Phase
          - entity: sensor.bathroom_shower_phase_ends
            name: Phase Ends At
          - entity: timer.bathroom_shower_boost
            name: Warming Remaining
          - entity: timer.bathroom_shower_dry
            name: Drying Remaining
          - type: divider
          - entity: input_boolean.bathroom_shower_automation
            name: Automation Enabled
          - entity: input_boolean.bathroom_shower_session
            name: Session Active
          - entity: sensor.bathroom_shower_cooldown_remaining
            name: Cooldown Remaining
          - entity: input_datetime.bathroom_shower_detected
            name: Last Detected

      # -----------------------------------------------------------------------
      - type: horizontal-stack
        cards:
          - type: button
            name: Boost Now
            icon: mdi:fire
            entity: script.bathroom_shower_boost_now
            show_state: false
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.bathroom_shower_boost_now
          - type: button
            name: Cancel
            icon: mdi:stop-circle
            entity: script.bathroom_shower_cancel
            show_state: false
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.bathroom_shower_cancel
          - type: button
            name: Reset Cooldown
            icon: mdi:timer-off-outline
            entity: script.bathroom_shower_reset_cooldown
            show_state: false
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.bathroom_shower_reset_cooldown

      # -----------------------------------------------------------------------
      - type: horizontal-stack
        cards:
          - type: gauge
            entity: sensor.ewelink_snzb_02p_humidity
            name: Humidity
            min: 30
            max: 100
            severity:
              green: 30
              yellow: 75
              red: 85
          - type: gauge
            entity: sensor.bathroom_humidity_rate
            name: Rise Rate
            unit: "%/min"
            min: -1
            max: 2
            needle: true
            severity:
              green: -1
              yellow: 0.4
              red: 0.8

      # -----------------------------------------------------------------------
      - type: entities
        title: Live Readings
        show_header_toggle: false
        entities:
          - entity: sensor.ewelink_snzb_02p_humidity
            name: Humidity
          - entity: sensor.ewelink_snzb_02p_temperature
            name: Temperature
          - type: divider
          - entity: sensor.bathroom_humidity_rate
            name: Humidity Rate
          - entity: sensor.bathroom_humidity_baseline
            name: Baseline (3 h minimum)
          - entity: sensor.bathroom_humidity_above_baseline
            name: Rise Above Baseline

      # -----------------------------------------------------------------------
      # Detection must satisfy rate AND rise-above-baseline AND the floor.
      # Too many false triggers -> raise the rate threshold.
      # Showers being missed   -> lower the rate threshold or the rise.
      - type: entities
        title: Detection Tuning
        show_header_toggle: false
        entities:
          - entity: input_number.bathroom_shower_rate_threshold
            name: Rate Threshold
          - entity: input_number.bathroom_shower_rise_above_baseline
            name: Rise Above Baseline
          - entity: input_number.bathroom_shower_min_humidity
            name: Minimum Humidity Floor
          - entity: input_number.bathroom_shower_cooldown_minutes
            name: Cooldown

      # -----------------------------------------------------------------------
      - type: entities
        title: Heating Phases
        show_header_toggle: false
        entities:
          - entity: input_number.bathroom_boost_temperature
            name: Warming Temperature
          - entity: input_number.bathroom_boost_minutes
            name: Warming Duration
          - type: divider
          - entity: input_number.bathroom_dry_temperature
            name: Drying Temperature
          - entity: input_number.bathroom_dry_minutes
            name: Drying Duration

      # -----------------------------------------------------------------------
      - type: entities
        title: Radiator Commands
        show_header_toggle: false
        entities:
          - entity: binary_sensor.bathroom_radiator_in_sync
            name: Radiator Matches Command
          - entity: input_boolean.bathroom_radiator_command_pending
            name: Awaiting Confirmation
          - entity: counter.bathroom_radiator_command_retries
            name: Retries
          - entity: input_select.bathroom_radiator_desired_mode
            name: Commanded Mode
          - entity: input_number.bathroom_radiator_desired_temperature
            name: Commanded Temperature
          - entity: input_datetime.bathroom_radiator_last_sent
            name: Last Sent
          - type: divider
          - entity: input_number.bathroom_radiator_retry_seconds
            name: Retry Interval
          - entity: input_number.bathroom_radiator_max_retries
            name: Max Retries

      # -----------------------------------------------------------------------
      - type: entities
        title: Group Overload Protection
        show_header_toggle: false
        entities:
          - entity: sensor.bathroom_group_power
            name: Group Load (Shelly)
          - entity: binary_sensor.bathroom_power_overload
            name: Overload
          - entity: binary_sensor.bathroom_power_headroom
            name: Room For Radiator
          - entity: input_boolean.bathroom_power_hold
            name: Heating Held
          - entity: sensor.bathroom_power_hold_duration
            name: Held For
          - type: divider
          - entity: input_number.bathroom_group_power_limit
            name: Group Power Limit
          - entity: input_number.bathroom_radiator_power
            name: Radiator Power
          - entity: input_number.bathroom_power_trip_seconds
            name: Trip Delay
          - entity: input_number.bathroom_power_recovery_seconds
            name: Restart Hold-off
          - entity: input_number.bathroom_power_restart_threshold_minutes
            name: Phase Restart Threshold
          - entity: input_number.bathroom_power_hold_timeout_minutes
            name: Hold Timeout

      # -----------------------------------------------------------------------
      - type: entities
        title: Sensor Health
        show_header_toggle: false
        entities:
          - entity: sensor.ewelink_snzb_02p_battery
            name: Battery
            secondary_info: last-changed
          - entity: input_number.bathroom_battery_alert_level
            name: Battery Alert Level
          - entity: sensor.ewelink_snzb_02p_humidity
            name: Last Humidity Report
            secondary_info: last-changed

      # -----------------------------------------------------------------------
      - type: history-graph
        title: Humidity and Detection
        hours_to_show: 24
        entities:
          - entity: sensor.ewelink_snzb_02p_humidity
            name: Humidity
          - entity: sensor.bathroom_humidity_baseline
            name: Baseline
          - entity: sensor.bathroom_humidity_rate
            name: Rate

      # -----------------------------------------------------------------------
      - type: history-graph
        title: Radiator and Session
        hours_to_show: 24
        entities:
          - entity: climate.badkamer_radiator
            name: Radiator
          - entity: sensor.ewelink_snzb_02p_temperature
            name: Bathroom Temperature
          - entity: input_boolean.bathroom_shower_session
            name: Session

      # -----------------------------------------------------------------------
      # Statistics rather than history: the Shelly reports roughly every
      # second, so a raw history graph pulls tens of thousands of points. The
      # 5-minute buckets are ~288 and are already computed by the recorder.
      - type: statistics-graph
        title: Group Load
        days_to_show: 1
        period: 5minute
        chart_type: line
        stat_types:
          - mean
          - max
        entities:
          - entity: sensor.bathroom_group_power
            name: Group Load

      # -----------------------------------------------------------------------
      # Discrete entities only write a row when they actually change, so these
      # stay cheap as raw history.
      - type: history-graph
        title: Holds
        hours_to_show: 12
        entities:
          - entity: binary_sensor.bathroom_power_overload
            name: Overload
          - entity: input_boolean.bathroom_power_hold
            name: Heating Held
