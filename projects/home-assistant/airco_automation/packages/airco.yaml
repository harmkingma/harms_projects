# =============================================================================
# Airco Package - timeslot control, 4 timeslots per room
# =============================================================================
# Requires Home Assistant 2024.10+ (modern triggers/conditions/actions syntax).
#
# Two Daikin units with a Faikout module, added to HA via MQTT discovery.
# Room keys used throughout this package:
#   masterbedroom   ->  climate.faikout_masterbedroom_mqtt_hvac
#   slaapkamer_2    ->  climate.faikout_slaapkamer_2_mqtt_hvac
#
# External entities used (Settings -> Entities, search "faikout"); if yours
# differ, search & replace them in this file:
#   climate.faikout_masterbedroom_mqtt_hvac
#   climate.faikout_slaapkamer_2_mqtt_hvac
#   sensor.faikout_<room>_lifetime_heating_energy    (kWh)
#   sensor.faikout_<room>_lifetime_cooling_energy    (kWh)
#
# INSTALL
#   1. Copy this file to /config/packages/airco.yaml
#   2. Ensure configuration.yaml contains:
#        homeassistant:
#          packages: !include_dir_named packages
#   3. Restart Home Assistant.
#   4. Set up the timeslots on the dashboard (see FIRST RUN), THEN enable Auto.
#
# CONTROL
# Each room has four timeslots, each with an enable switch, start, end, mode
# (Heat / Cool / Auto / Off) and temperature. The airco itself keeps the room
# at temperature; this package only tells it what to do at slot boundaries:
#
#   slot starts, mode Heat/Cool/Auto  -> airco on in that mode at the slot
#                                        temperature
#   slot starts, mode Off             -> airco off
#   slot ends, no other slot active   -> airco off (nothing after an Off slot)
#
#   - Changing the mode or temperature of the active slot, or switching Auto
#     on during a slot, applies it at once.
#   - A slot may cross midnight (e.g. 22:00 -> 07:00).
#   - Start == end means the slot is never active.
#   - If slots overlap, the lowest-numbered slot wins; when it ends, the other
#     one takes over.
#   - Every command is checked and repeated (up to 3 times) when the unit does
#     not confirm it, because Faikout MQTT commands are occasionally lost.
#
# MANUAL USE
# Between slot boundaries the airco is left alone: changes made with the
# remote or the app hold until the next slot starts or ends. With Auto off the
# timeslots do nothing at all.
#
# FIRST RUN
# Helpers carry no 'initial:' value, because that would overwrite your
# settings on every restart. Per slot set start, end, mode and temperature
# BEFORE enabling it, then switch Auto on.
# =============================================================================

