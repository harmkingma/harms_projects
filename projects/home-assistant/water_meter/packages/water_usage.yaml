# =============================================================================
# Water Usage Package - draw detection, usage classification, hot water gas
# =============================================================================
# Builds on packages/water_meter.yaml (Water Meter Reader add-on) and READS,
# never changes, these entities from other packages:
#   input_datetime.bathroom_shower_detected   bathroom_radiator.yaml (humidity)
#   input_boolean.bathroom_shower_session     bathroom_radiator.yaml
#   sensor.gas_meter_gas                      DSMR smart meter, m3, every 5 min
# If the bathroom package is missing, showers are classified as "other".
#
# Requires Home Assistant 2024.10+ (modern triggers/conditions/actions syntax).
#
# DRAWS
# The Water Meter Reader add-on detects the draws: it reads the meter every
# 30 s, and every 10 s while water runs, and publishes a start and an end
# message on water_meter/draw. A draw ends after 120 s without flow (add-on
# option draw_gap_s), so a shower with a short pause stays one draw. Per draw:
#   volume     exact, the meter difference
#   start/end  placed inside the sampling interval: the litres in the first
#              and last interval divided by the flow of the interval next to
#              it give how long the water ran in it
#   flowing    the time the water actually ran; pauses do not count, so
#              average flow = volume / flowing time is the real flow rate
#   main run   the part at the draw's main flow level (the shower itself).
#              Use before or after it that is separated by a dry reading and
#              stays below half that level (washbasin after the shower) is
#              side water and is counted as tap (< 4 L) or other.
# Classification and the per-type flow use the main run. Use running at the
# same time (a toilet refill during the shower) cannot be told apart.
#
# CLASSIFICATION (thresholds in the wm_draw_finished automation variables)
#   shower     humidity detection fired between draw start and the gas
#              settle time after the end, or the shower session was already
#              running (second shower), and >= 3 min and >= 15 L
#   toilet     4-12 L in <= 3.5 min (a washing machine or dishwasher fill
#              looks the same and lands here too)
#   tap        < 4 L
#   long_draw  >= 30 min (garden, filling something)
#   other      everything else (kitchen hot water, cleaning, ...)
#
# GAS PER DRAW
# The combi boiler only burns gas for tap water, or for space heating when the
# hybrid heat pump calls for it. Per draw: gas meter difference from draw start
# until "Gas Settle" minutes after the end (the DSMR gas value lags up to
# 5 min), minus the gas rate measured just before the draw (space heating) over
# the same period. If a new draw starts within the settle time the window is
# cut at its start, so gas is not counted twice.
#
# HEAT-PUMP BOILER COMPARISON
# Hot water heat = hot water gas x calorific value x combi efficiency. A
# heat-pump boiler needs (heat + its standby loss) / COP in electricity.
# Projections scale the totals since "Usage Tracking Start" to a year and stay
# unavailable for the first 7 days; they settle after a few weeks and shift
# with the seasons (colder mains water in winter needs more heat). Check the
# price and COP helpers against your contract and the boiler's datasheet
# (COP per EN 16147).
#
# FLOW PER TYPE
# Each type total keeps the litres and minutes of water actually running as
# attributes (flowing_l, flowing_min), so average flow per type = litres /
# minutes (e.g. the shower head's real L/min). Draws with a reading gap (add-on
# down) count for the volume only.
#
# BOILER SIZE
# Hot water demand is counted as litres at shower temperature ("V40"):
# showers by their measured volume (already mixed), other draws
# from their gas heat. Draws less than "Hot Session Gap" apart form one
# session; the largest session since tracking (input_number, reset it to 0 to
# start over) must come from the tank without reheating. A tank at T_tank
# gives V_tank x (T_tank - T_cold) / (T_shower - T_cold) x usable fraction
# litres at shower temperature, so
#   required tank = peak session x (1 + margin) / that factor
#
# SOLAR (virtual smart heat-pump boiler)
# Every minute a simulated boiler of "Tank Size" runs on the real P1 export:
# when export covers at least 70 % of its electric power (heat output / COP)
# it heats, up to "Solar Tank Temperature"; hot water draws (their gas heat)
# and the standby loss drain it. The grid tops it up to one peak hot water
# session at 05:00 (before the morning showers) and otherwise only keeps a
# 15 % comfort floor, so the sun gets the chance to refill it. The EV, the
# aircos and office days are already in the export, so the measured solar
# share includes them. That share is seasonal (low in winter), so the costs
# use the yearly share the Water Meter Reader add-on simulates every night at
# 03:30 (sensor.water_meter_boiler_solar_share_year): measured months as
# they are, missing months estimated from the most similar measured month
# scaled by a typical Dutch solar curve. Until that sensor has a value the
# "Solar Share (year)" helper is used. Solar power
# costs the feed-in compensation you give up by not exporting it (after the
# end of net metering in 2027 that is the feed-in price, not the full tariff).
# =============================================================================

input_boolean:
  wm_usage_initialised:
    name: WM Usage Initialised
    icon: mdi:check-decagram

  wm_sizing_initialised:
    name: WM Boiler Sizing Initialised
    icon: mdi:check-decagram

  wm_solar_initialised:
    name: WM Solar Model Initialised
    icon: mdi:check-decagram

input_number:
  wm_gas_settle_minutes:
    name: WM Gas Settle
    min: 5
    max: 30
    step: 1
    unit_of_measurement: min
    mode: box
    icon: mdi:timer-sand

  wm_gas_kwh_per_m3:
    name: WM Gas Calorific Value
    min: 8
    max: 12
    step: 0.01
    unit_of_measurement: kWh/m³
    mode: box
    icon: mdi:fire

  wm_combi_efficiency:
    name: WM Combi Boiler Hot Water Efficiency
    min: 50
    max: 100
    step: 1
    unit_of_measurement: "%"
    mode: box
    icon: mdi:water-boiler

  wm_hp_boiler_cop:
    name: WM Heat-Pump Boiler COP
    min: 1
    max: 5
    step: 0.1
    mode: box
    icon: mdi:heat-pump-outline

  wm_hp_boiler_standby_kwh:
    name: WM Heat-Pump Boiler Standby Loss
    min: 0
    max: 5
    step: 0.1
    unit_of_measurement: kWh/day
    mode: box
    icon: mdi:thermometer-minus

  wm_gas_price:
    name: WM Gas Price
    min: 0
    max: 5
    step: 0.01
    unit_of_measurement: €/m³
    mode: box
    icon: mdi:currency-eur

  wm_electricity_price:
    name: WM Electricity Price
    min: 0
    max: 2
    step: 0.01
    unit_of_measurement: €/kWh
    mode: box
    icon: mdi:currency-eur

  wm_hp_boiler_investment:
    name: WM Heat-Pump Boiler Investment
    min: 0
    max: 20000
    step: 50
    unit_of_measurement: €
    mode: box
    icon: mdi:cash

  # --- boiler sizing ---
  wm_cold_water_temp:
    name: WM Cold Water Temperature
    min: 2
    max: 25
    step: 0.5
    unit_of_measurement: "°C"
    mode: box
    icon: mdi:thermometer-low

  wm_shower_temp:
    name: WM Shower Temperature
    min: 30
    max: 50
    step: 0.5
    unit_of_measurement: "°C"
    mode: box
    icon: mdi:shower-head

  wm_tank_temp:
    name: WM Tank Temperature
    min: 40
    max: 75
    step: 1
    unit_of_measurement: "°C"
    mode: box
    icon: mdi:thermometer-high

  # Share of the tank delivered before the outlet cools (stratification).
  wm_tank_usable:
    name: WM Tank Usable Fraction
    min: 50
    max: 100
    step: 1
    unit_of_measurement: "%"
    mode: box
    icon: mdi:water-percent

  wm_boiler_margin:
    name: WM Boiler Size Margin
    min: 0
    max: 100
    step: 5
    unit_of_measurement: "%"
    mode: box
    icon: mdi:plus-box-outline

  wm_hp_boiler_heat_kw:
    name: WM Heat-Pump Boiler Heat Output
    min: 0.3
    max: 5
    step: 0.1
    unit_of_measurement: kW
    mode: box
    icon: mdi:heat-wave

  wm_hot_session_gap_minutes:
    name: WM Hot Session Gap
    min: 10
    max: 240
    step: 5
    unit_of_measurement: min
    mode: box
    icon: mdi:timer-pause-outline

  # Written by wm_draw_finished; set the peak to 0 to restart the sizing.
  wm_hot_session_v40:
    name: WM Hot Session Volume
    min: 0
    max: 5000
    step: 0.1
    unit_of_measurement: L
    mode: box
    icon: mdi:water-thermometer

  wm_hot_peak_session_v40:
    name: WM Hot Peak Session Volume
    min: 0
    max: 5000
    step: 0.1
    unit_of_measurement: L
    mode: box
    icon: mdi:water-thermometer-outline

  # --- solar / virtual boiler ---
  wm_hp_boiler_tank_l:
    name: WM Heat-Pump Boiler Tank Size
    min: 50
    max: 500
    step: 10
    unit_of_measurement: L
    mode: box
    icon: mdi:water-boiler

  wm_solar_tank_temp:
    name: WM Solar Tank Temperature
    min: 45
    max: 75
    step: 1
    unit_of_measurement: "°C"
    mode: box
    icon: mdi:solar-power

  wm_feed_in_price:
    name: WM Feed-in Price
    min: -0.5
    max: 1
    step: 0.01
    unit_of_measurement: €/kWh
    mode: box
    icon: mdi:transmission-tower-export

  wm_solar_share_year:
    name: WM Solar Share (year)
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
    mode: box
    icon: mdi:solar-power-variant

  # Virtual boiler state, written every minute by wm_virtual_boiler_step.
  wm_vb_energy:
    name: WM Virtual Boiler Stored Heat
    min: 0
    max: 100
    step: 0.001
    unit_of_measurement: kWh
    mode: box
    icon: mdi:thermometer-water

  wm_vb_solar_kwh:
    name: WM Virtual Boiler Solar Electricity
    min: 0
    max: 100000
    step: 0.001
    unit_of_measurement: kWh
    mode: box
    icon: mdi:solar-power

  wm_vb_grid_kwh:
    name: WM Virtual Boiler Grid Electricity
    min: 0
    max: 100000
    step: 0.001
    unit_of_measurement: kWh
    mode: box
    icon: mdi:transmission-tower-import

  # --- state of the draw in progress, written by the automations below ---
  wm_draw_gas_start:
    name: WM Draw Gas Start
    min: 0
    max: 999999
    step: 0.001
    unit_of_measurement: m³
    mode: box
    icon: mdi:fire

  wm_draw_gas_baseline:
    name: WM Draw Gas Baseline Rate
    min: 0
    max: 10
    step: 0.001
    unit_of_measurement: m³/h
    mode: box
    icon: mdi:fire-circle

input_datetime:
  wm_draw_start:
    name: WM Draw Start
    has_date: true
    has_time: true
    icon: mdi:water-pump

  wm_usage_tracking_start:
    name: WM Usage Tracking Start
    has_date: true
    has_time: true
    icon: mdi:calendar-start

  wm_hot_session_last_end:
    name: WM Hot Session Last End
    has_date: true
    has_time: true
    icon: mdi:clock-end

# -----------------------------------------------------------------------------
# Gas rate before a draw (space heating baseline)
# -----------------------------------------------------------------------------
sensor:
  - platform: derivative
    source: sensor.gas_meter_gas
    name: Gas Rate
    unique_id: gas_rate_30min
    unit_time: h
    time_window: "00:30:00"
    round: 3

# -----------------------------------------------------------------------------
# Draw detection and per-draw results
# -----------------------------------------------------------------------------
template:
  # Everything below updates on the event fired by wm_draw_finished. Trigger
  # based sensors restore their state, so the running totals survive restarts.
  # add_l / add_flowing_l / add_flowing_min hold the litres and running minutes
  # per total (shower, toilet, tap, other), main run and side water together.
  - triggers:
      - trigger: event
        event_type: water_draw_finished
    sensor:
      - name: Water Last Draw
        unique_id: water_last_draw
        icon: mdi:water-check
        state: "{{ trigger.event.data.category }}"
        attributes:
          start: "{{ trigger.event.data.start }}"
          end: "{{ trigger.event.data.end }}"
          volume_l: "{{ trigger.event.data.volume_l }}"
          duration_min: "{{ trigger.event.data.duration_min }}"
          flowing_min: "{{ trigger.event.data.flowing_min }}"
          avg_flow_lpm: "{{ trigger.event.data.avg_flow }}"
          peak_flow_lpm: "{{ trigger.event.data.peak_flow }}"
          side_volume_l: "{{ trigger.event.data.side_volume_l }}"
          side_category: "{{ trigger.event.data.side_category }}"
          draw_volume_l: "{{ trigger.event.data.draw_volume_l }}"
          timing_complete: "{{ trigger.event.data.complete }}"
          gas_m3: "{{ trigger.event.data.gas_m3 }}"
          heat_kwh: "{{ trigger.event.data.heat_kwh }}"
          hot_water_l_at_shower_temp: "{{ trigger.event.data.v40_l }}"
          hot_session_l: "{{ trigger.event.data.session_v40_l }}"
          space_heating_active: "{{ trigger.event.data.heating }}"

      - name: Water Last Shower Volume
        unique_id: water_last_shower_volume
        unit_of_measurement: L
        icon: mdi:shower-head
        state: >-
          {%- if trigger.event.data.category == 'shower' -%}
            {{ trigger.event.data.volume_l }}
          {%- else -%}
            {{ this.state if this.state | is_number else none }}
          {%- endif -%}
        attributes:
          start: >-
            {{ trigger.event.data.start if trigger.event.data.category == 'shower'
               else this.attributes.get('start') }}
          duration_min: >-
            {{ trigger.event.data.duration_min if trigger.event.data.category == 'shower'
               else this.attributes.get('duration_min') }}
          flowing_min: >-
            {{ trigger.event.data.flowing_min if trigger.event.data.category == 'shower'
               else this.attributes.get('flowing_min') }}
          gas_m3: >-
            {{ trigger.event.data.gas_m3 if trigger.event.data.category == 'shower'
               else this.attributes.get('gas_m3') }}
          avg_flow_lpm: >-
            {{ trigger.event.data.avg_flow if trigger.event.data.category == 'shower'
               else this.attributes.get('avg_flow_lpm') }}

      - name: Water Shower Count
        unique_id: water_shower_count
        state_class: total_increasing
        icon: mdi:counter
        state: >-
          {{ this.state | int(0) + (1 if trigger.event.data.category == 'shower' else 0) }}

      - name: Water Shower Total
        unique_id: water_shower_total
        unit_of_measurement: L
        device_class: water
        state_class: total_increasing
        icon: mdi:shower-head
        state: >-
          {{ (this.state | float(0) + trigger.event.data.add_l.get('shower', 0) | float(0)) | round(1) }}
        attributes:
          flowing_min: >-
            {{ (this.attributes.get('flowing_min', 0) | float(0)
                + trigger.event.data.add_flowing_min.get('shower', 0) | float(0)) | round(2) }}
          flowing_l: >-
            {{ (this.attributes.get('flowing_l', 0) | float(0)
                + trigger.event.data.add_flowing_l.get('shower', 0) | float(0)) | round(1) }}

      - name: Water Toilet Total
        unique_id: water_toilet_total
        unit_of_measurement: L
        device_class: water
        state_class: total_increasing
        icon: mdi:toilet
        state: >-
          {{ (this.state | float(0) + trigger.event.data.add_l.get('toilet', 0) | float(0)) | round(1) }}
        attributes:
          flowing_min: >-
            {{ (this.attributes.get('flowing_min', 0) | float(0)
                + trigger.event.data.add_flowing_min.get('toilet', 0) | float(0)) | round(2) }}
          flowing_l: >-
            {{ (this.attributes.get('flowing_l', 0) | float(0)
                + trigger.event.data.add_flowing_l.get('toilet', 0) | float(0)) | round(1) }}

      - name: Water Tap Total
        unique_id: water_tap_total
        unit_of_measurement: L
        device_class: water
        state_class: total_increasing
        icon: mdi:faucet
        state: >-
          {{ (this.state | float(0) + trigger.event.data.add_l.get('tap', 0) | float(0)) | round(1) }}
        attributes:
          flowing_min: >-
            {{ (this.attributes.get('flowing_min', 0) | float(0)
                + trigger.event.data.add_flowing_min.get('tap', 0) | float(0)) | round(2) }}
          flowing_l: >-
            {{ (this.attributes.get('flowing_l', 0) | float(0)
                + trigger.event.data.add_flowing_l.get('tap', 0) | float(0)) | round(1) }}

      - name: Water Other Total
        unique_id: water_other_total
        unit_of_measurement: L
        device_class: water
        state_class: total_increasing
        icon: mdi:water
        state: >-
          {{ (this.state | float(0) + trigger.event.data.add_l.get('other', 0) | float(0)) | round(1) }}
        attributes:
          flowing_min: >-
            {{ (this.attributes.get('flowing_min', 0) | float(0)
                + trigger.event.data.add_flowing_min.get('other', 0) | float(0)) | round(2) }}
          flowing_l: >-
            {{ (this.attributes.get('flowing_l', 0) | float(0)
                + trigger.event.data.add_flowing_l.get('other', 0) | float(0)) | round(1) }}

      # Litres at shower temperature: the demand a hot water tank has to cover.
      - name: Hot Water Demand Total
        unique_id: hot_water_demand_total
        unit_of_measurement: L
        device_class: water
        state_class: total_increasing
        icon: mdi:water-thermometer
        state: >-
          {{ (this.state | float(0) + trigger.event.data.v40_l | float(0)) | round(1) }}

      - name: Gas Hot Water Total
        unique_id: gas_hot_water_total
        unit_of_measurement: m³
        device_class: gas
        state_class: total_increasing
        icon: mdi:water-boiler
        state: >-
          {{ (this.state | float(0) + trigger.event.data.gas_m3 | float(0)) | round(3) }}

      - name: Gas Shower Total
        unique_id: gas_shower_total
        unit_of_measurement: m³
        device_class: gas
        state_class: total_increasing
        icon: mdi:shower
        state: >-
          {{ (this.state | float(0) + (trigger.event.data.gas_m3 | float(0)
              if trigger.event.data.category == 'shower' else 0)) | round(3) }}

  # ---------------------------------------------------------------------------
  # Averages, boiler sizing and the heat-pump boiler comparison
  # ---------------------------------------------------------------------------
  - sensor:
      - name: Usage Tracking Days
        unique_id: usage_tracking_days
        unit_of_measurement: d
        icon: mdi:calendar-clock
        availability: >-
          {{ (state_attr('input_datetime.wm_usage_tracking_start', 'timestamp') | float(0)) > 946684800 }}
        state: >-
          {{ ((now().timestamp() - state_attr('input_datetime.wm_usage_tracking_start', 'timestamp') | float(0))
              / 86400) | round(1) }}

      # Litres / minutes the water actually ran (pauses excluded): the real flow rate.
      - name: Water Shower Average Flow
        unique_id: water_shower_average_flow
        unit_of_measurement: L/min
        icon: mdi:shower-head
        availability: "{{ state_attr('sensor.water_shower_total', 'flowing_min') | float(0) > 0 }}"
        state: >-
          {{ (state_attr('sensor.water_shower_total', 'flowing_l') | float(0)
              / state_attr('sensor.water_shower_total', 'flowing_min') | float(1)) | round(1) }}

      - name: Water Toilet Average Flow
        unique_id: water_toilet_average_flow
        unit_of_measurement: L/min
        icon: mdi:toilet
        availability: "{{ state_attr('sensor.water_toilet_total', 'flowing_min') | float(0) > 0 }}"
        state: >-
          {{ (state_attr('sensor.water_toilet_total', 'flowing_l') | float(0)
              / state_attr('sensor.water_toilet_total', 'flowing_min') | float(1)) | round(1) }}

      - name: Water Tap Average Flow
        unique_id: water_tap_average_flow
        unit_of_measurement: L/min
        icon: mdi:faucet
        availability: "{{ state_attr('sensor.water_tap_total', 'flowing_min') | float(0) > 0 }}"
        state: >-
          {{ (state_attr('sensor.water_tap_total', 'flowing_l') | float(0)
              / state_attr('sensor.water_tap_total', 'flowing_min') | float(1)) | round(1) }}

      - name: Water Other Average Flow
        unique_id: water_other_average_flow
        unit_of_measurement: L/min
        icon: mdi:water
        availability: "{{ state_attr('sensor.water_other_total', 'flowing_min') | float(0) > 0 }}"
        state: >-
          {{ (state_attr('sensor.water_other_total', 'flowing_l') | float(0)
              / state_attr('sensor.water_other_total', 'flowing_min') | float(1)) | round(1) }}

      - name: Hot Water Demand Per Day
        unique_id: hot_water_demand_per_day
        unit_of_measurement: L
        icon: mdi:water-thermometer
        availability: >-
          {{ states('sensor.usage_tracking_days') | float(0) >= 1 and has_value('sensor.hot_water_demand_total') }}
        state: >-
          {{ (states('sensor.hot_water_demand_total') | float(0)
              / states('sensor.usage_tracking_days') | float(1)) | round(0) }}

      - name: Hot Water Peak Session
        unique_id: hot_water_peak_session
        unit_of_measurement: L
        icon: mdi:water-thermometer-outline
        state: "{{ states('input_number.wm_hot_peak_session_v40') | float(0) | round(0) }}"

      - name: Heat-Pump Boiler Required Size
        unique_id: heat_pump_boiler_required_size
        unit_of_measurement: L
        icon: mdi:water-boiler
        availability: "{{ states('input_number.wm_hot_peak_session_v40') | float(0) > 0 }}"
        state: >-
          {%- set cold = states('input_number.wm_cold_water_temp') | float(10) -%}
          {%- set mix = states('input_number.wm_shower_temp') | float(40) -%}
          {%- set tank = states('input_number.wm_tank_temp') | float(55) -%}
          {%- set usable = states('input_number.wm_tank_usable') | float(90) / 100 -%}
          {%- set factor = (tank - cold) / [mix - cold, 1] | max * usable -%}
          {%- set margin = 1 + states('input_number.wm_boiler_margin') | float(20) / 100 -%}
          {{ (states('input_number.wm_hot_peak_session_v40') | float(0) * margin / [factor, 0.1] | max) | round(0) }}
        attributes:
          standard_size: >-
            {%- set cold = states('input_number.wm_cold_water_temp') | float(10) -%}
            {%- set factor = (states('input_number.wm_tank_temp') | float(55) - cold)
                 / [states('input_number.wm_shower_temp') | float(40) - cold, 1] | max
                 * states('input_number.wm_tank_usable') | float(90) / 100 -%}
            {%- set need = states('input_number.wm_hot_peak_session_v40') | float(0)
                 * (1 + states('input_number.wm_boiler_margin') | float(20) / 100) / [factor, 0.1] | max -%}
            {{ ([80, 100, 120, 150, 200, 250, 300] | select('>=', need) | list + [300]) | first }}
          # Full reheat of that tank from cold water to tank temperature.
          reheat_hours: >-
            {%- set cold = states('input_number.wm_cold_water_temp') | float(10) -%}
            {%- set tank = states('input_number.wm_tank_temp') | float(55) -%}
            {%- set factor = (tank - cold) / [states('input_number.wm_shower_temp') | float(40) - cold, 1] | max
                 * states('input_number.wm_tank_usable') | float(90) / 100 -%}
            {%- set need = states('input_number.wm_hot_peak_session_v40') | float(0)
                 * (1 + states('input_number.wm_boiler_margin') | float(20) / 100) / [factor, 0.1] | max -%}
            {%- set size = ([80, 100, 120, 150, 200, 250, 300] | select('>=', need) | list + [300]) | first -%}
            {{ (size * 4.186 * (tank - cold) / 3600
                / [states('input_number.wm_hp_boiler_heat_kw') | float(1.5), 0.1] | max) | round(1) }}

      - name: Water Shower Average Volume
        unique_id: water_shower_average_volume
        unit_of_measurement: L
        icon: mdi:shower-head
        availability: "{{ states('sensor.water_shower_count') | int(0) > 0 }}"
        state: >-
          {{ (states('sensor.water_shower_total') | float(0)
              / states('sensor.water_shower_count') | int(1)) | round(1) }}

      - name: Gas Shower Average
        unique_id: gas_shower_average
        unit_of_measurement: m³
        icon: mdi:fire
        availability: "{{ states('sensor.water_shower_count') | int(0) > 0 }}"
        state: >-
          {{ (states('sensor.gas_shower_total') | float(0)
              / states('sensor.water_shower_count') | int(1)) | round(3) }}

      - name: Shower Average Cost
        unique_id: shower_average_cost
        unit_of_measurement: €
        device_class: monetary
        icon: mdi:currency-eur
        availability: "{{ has_value('sensor.gas_shower_average') }}"
        state: >-
          {{ (states('sensor.gas_shower_average') | float(0)
              * states('input_number.wm_gas_price') | float(0)) | round(2) }}

      - name: Hot Water Gas Per Year
        unique_id: hot_water_gas_per_year
        unit_of_measurement: m³
        icon: mdi:calendar-range
        # Too few days make a year projection meaningless.
        availability: >-
          {{ states('sensor.usage_tracking_days') | float(0) >= 7
             and has_value('sensor.gas_hot_water_total') }}
        state: >-
          {{ (states('sensor.gas_hot_water_total') | float(0)
              / states('sensor.usage_tracking_days') | float(7) * 365) | round(0) }}

      - name: Hot Water Heat Per Year
        unique_id: hot_water_heat_per_year
        unit_of_measurement: kWh
        icon: mdi:water-thermometer
        availability: "{{ has_value('sensor.hot_water_gas_per_year') }}"
        state: >-
          {{ (states('sensor.hot_water_gas_per_year') | float(0)
              * states('input_number.wm_gas_kwh_per_m3') | float(9.77)
              * states('input_number.wm_combi_efficiency') | float(85) / 100) | round(0) }}

      - name: Hot Water Gas Cost Per Year
        unique_id: hot_water_gas_cost_per_year
        unit_of_measurement: €
        device_class: monetary
        icon: mdi:fire
        availability: "{{ has_value('sensor.hot_water_gas_per_year') }}"
        state: >-
          {{ (states('sensor.hot_water_gas_per_year') | float(0)
              * states('input_number.wm_gas_price') | float(0)) | round(0) }}

      - name: Heat-Pump Boiler Electricity Per Year
        unique_id: heat_pump_boiler_electricity_per_year
        unit_of_measurement: kWh
        icon: mdi:heat-pump-outline
        availability: "{{ has_value('sensor.hot_water_heat_per_year') }}"
        state: >-
          {%- set cop = [states('input_number.wm_hp_boiler_cop') | float(2.8), 0.5] | max -%}
          {{ ((states('sensor.hot_water_heat_per_year') | float(0)
               + states('input_number.wm_hp_boiler_standby_kwh') | float(0) * 365) / cop) | round(0) }}

      - name: Heat-Pump Boiler Cost Per Year
        unique_id: heat_pump_boiler_cost_per_year
        unit_of_measurement: €
        device_class: monetary
        icon: mdi:heat-pump
        availability: "{{ has_value('sensor.heat_pump_boiler_electricity_per_year') }}"
        # Solar part costs the feed-in compensation given up, the rest the grid price.
        state: >-
          {%- set sim = states('sensor.water_meter_boiler_solar_share_year') -%}
          {%- set s = (sim if sim | is_number else states('input_number.wm_solar_share_year')) | float(0) / 100 -%}
          {{ (states('sensor.heat_pump_boiler_electricity_per_year') | float(0)
              * ((1 - s) * states('input_number.wm_electricity_price') | float(0)
                 + s * states('input_number.wm_feed_in_price') | float(0))) | round(0) }}
        attributes:
          solar_share_source: >-
            {{ 'add-on simulation' if states('sensor.water_meter_boiler_solar_share_year') | is_number
               else 'manual estimate' }}
          all_grid_cost: >-
            {{ (states('sensor.heat_pump_boiler_electricity_per_year') | float(0)
                * states('input_number.wm_electricity_price') | float(0)) | round(0) }}

      - name: Heat-Pump Boiler Measured Solar Share
        unique_id: heat_pump_boiler_measured_solar_share
        unit_of_measurement: "%"
        icon: mdi:solar-power-variant
        availability: >-
          {{ states('input_number.wm_vb_solar_kwh') | float(0)
             + states('input_number.wm_vb_grid_kwh') | float(0) > 0 }}
        state: >-
          {%- set s = states('input_number.wm_vb_solar_kwh') | float(0) -%}
          {{ (100 * s / (s + states('input_number.wm_vb_grid_kwh') | float(0))) | round(0) }}
        attributes:
          solar_kwh: "{{ states('input_number.wm_vb_solar_kwh') | float(0) | round(1) }}"
          grid_kwh: "{{ states('input_number.wm_vb_grid_kwh') | float(0) | round(1) }}"

      - name: Heat-Pump Boiler Saving Per Year
        unique_id: heat_pump_boiler_saving_per_year
        unit_of_measurement: €
        device_class: monetary
        icon: mdi:piggy-bank
        availability: >-
          {{ has_value('sensor.hot_water_gas_cost_per_year')
             and has_value('sensor.heat_pump_boiler_cost_per_year') }}
        state: >-
          {{ (states('sensor.hot_water_gas_cost_per_year') | float(0)
              - states('sensor.heat_pump_boiler_cost_per_year') | float(0)) | round(0) }}

      - name: Heat-Pump Boiler Payback
        unique_id: heat_pump_boiler_payback
        unit_of_measurement: years
        icon: mdi:cash-clock
        # Unknown while there is no saving: it never pays back.
        availability: "{{ states('sensor.heat_pump_boiler_saving_per_year') | float(0) > 0 }}"
        state: >-
          {{ (states('input_number.wm_hp_boiler_investment') | float(0)
              / states('sensor.heat_pump_boiler_saving_per_year') | float(1)) | round(1) }}

utility_meter:
  water_shower_daily:
    name: Water Shower Daily
    unique_id: water_shower_daily
    source: sensor.water_shower_total
    cycle: daily
  water_shower_monthly:
    name: Water Shower Monthly
    unique_id: water_shower_monthly
    source: sensor.water_shower_total
    cycle: monthly
  gas_hot_water_daily:
    name: Gas Hot Water Daily
    unique_id: gas_hot_water_daily
    source: sensor.gas_hot_water_total
    cycle: daily
  gas_hot_water_monthly:
    name: Gas Hot Water Monthly
    unique_id: gas_hot_water_monthly
    source: sensor.gas_hot_water_total
    cycle: monthly
  gas_shower_monthly:
    name: Gas Shower Monthly
    unique_id: gas_shower_monthly
    source: sensor.gas_shower_total
    cycle: monthly
  gas_all_monthly:
    name: Gas All Monthly
    unique_id: gas_all_monthly
    source: sensor.gas_meter_gas
    cycle: monthly

# -----------------------------------------------------------------------------
# Automations
# -----------------------------------------------------------------------------
automation:
  # input_number has no persistent default: without "initial" it starts at its
  # minimum, with "initial" every restart overwrites the user's value.
  - id: wm_usage_initialise_settings
    alias: "Water usage: initialise settings"
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: automation_reloaded
    conditions:
      - condition: state
        entity_id: input_boolean.wm_usage_initialised
        state: "off"
    actions:
      - action: input_number.set_value
        target:
          entity_id: input_number.wm_gas_settle_minutes
        data:
          value: 10
      - action: input_number.set_value
        target:
          entity_id: input_number.wm_gas_kwh_per_m3
        data:
          value: 9.77
      - action: input_number.set_value
        target:
          entity_id: input_number.wm_combi_efficiency
        data:
          value: 85
      - action: input_number.set_value
        target:
          entity_id: input_number.wm_hp_boiler_cop
        data:
          value: 2.8
      - action: input_number.set_value
        target:
          entity_id: input_number.wm_hp_boiler_standby_kwh
        data:
          value: 1.0
      - action: input_number.set_value
        target:
          entity_id: input_number.wm_gas_price
        data:
          value: 1.40
      - action: input_number.set_value
        target:
          entity_id: input_number.wm_electricity_price
        data:
          value: 0.28
      - action: input_number.set_value
        target:
          entity_id: input_number.wm_hp_boiler_investment
        data:
          value: 2500
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.wm_usage_tracking_start
        data:
          timestamp: "{{ now().timestamp() }}"
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.wm_usage_initialised

  - id: wm_sizing_initialise_settings
    alias: "Water usage: initialise boiler sizing settings"
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: automation_reloaded
    conditions:
      - condition: state
        entity_id: input_boolean.wm_sizing_initialised
        state: "off"
    actions:
      - action: input_number.set_value
        target:
          entity_id: input_number.wm_cold_water_temp
        data:
          value: 10
      - action: input_number.set_value
        target:
          entity_id: input_number.wm_shower_temp
        data:
          value: 40
      - action: input_number.set_value
        target:
          entity_id: input_number.wm_tank_temp
        data:
          value: 55
      - action: input_number.set_value
        target:
          entity_id: input_number.wm_tank_usable
        data:
          value: 90
      - action: input_number.set_value
        target:
          entity_id: input_number.wm_boiler_margin
        data:
          value: 20
      - action: input_number.set_value
        target:
          entity_id: input_number.wm_hp_boiler_heat_kw
        data:
          value: 1.5
      - action: input_number.set_value
        target:
          entity_id: input_number.wm_hot_session_gap_minutes
        data:
          value: 60
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.wm_sizing_initialised

  - id: wm_solar_initialise_settings
    alias: "Water usage: initialise solar settings"
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: automation_reloaded
    conditions:
      - condition: state
        entity_id: input_boolean.wm_solar_initialised
        state: "off"
    actions:
      - action: input_number.set_value
        target:
          entity_id: input_number.wm_hp_boiler_tank_l
        data:
          value: 200
      - action: input_number.set_value
        target:
          entity_id: input_number.wm_solar_tank_temp
        data:
          value: 60
      - action: input_number.set_value
        target:
          entity_id: input_number.wm_feed_in_price
        data:
          value: 0.05
      # Rough first guess; used until the add-on's nightly simulation has a value.
      - action: input_number.set_value
        target:
          entity_id: input_number.wm_solar_share_year
        data:
          value: 50
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.wm_solar_initialised

  # Simulated smart heat-pump boiler on the real P1 export (see header).
  - id: wm_virtual_boiler_step
    alias: "Water usage: virtual heat-pump boiler"
    mode: queued
    max: 3
    max_exceeded: silent
    triggers:
      - trigger: time_pattern
        id: tick
        minutes: /1
      - trigger: event
        id: draw
        event_type: water_draw_finished
    conditions:
      - condition: state
        entity_id: input_boolean.wm_solar_initialised
        state: "on"
    variables:
      cold: "{{ states('input_number.wm_cold_water_temp') | float(10) }}"
      cop: "{{ [states('input_number.wm_hp_boiler_cop') | float(2.8), 0.5] | max }}"
      heat_kw: "{{ states('input_number.wm_hp_boiler_heat_kw') | float(1.5) }}"
      el_kw: "{{ heat_kw / cop }}"
      capacity: >-
        {{ states('input_number.wm_hp_boiler_tank_l') | float(200) * 4.186
           * (states('input_number.wm_solar_tank_temp') | float(60) - cold) / 3600 }}
      # 05:00: grid tops up to one peak session (30 % until a peak is known);
      # the rest of the day only a 15 % comfort floor.
      reserve: >-
        {%- set peak = states('input_number.wm_hot_peak_session_v40') | float(0) -%}
        {%- set need = peak * (1 + states('input_number.wm_boiler_margin') | float(20) / 100) * 4.186
             * (states('input_number.wm_shower_temp') | float(40) - cold) / 3600 -%}
        {%- if trigger.id == 'tick' and now().hour == 5 and now().minute == 0 -%}
          {{ [need if peak > 0 else 0.3 * capacity, capacity] | min }}
        {%- else -%}
          {{ 0.15 * capacity }}
        {%- endif -%}
      stored: "{{ states('input_number.wm_vb_energy') | float(0) }}"
      export_kw: "{{ [-(states('sensor.p1_meter_power') | float(0)), 0] | max / 1000 }}"
      run: >-
        {{ trigger.id == 'tick' and stored + heat_kw / 60 <= capacity and export_kw >= 0.7 * el_kw }}
      solar_el: "{{ ([export_kw, el_kw] | min / 60) if run else 0 }}"
      grid_run_el: "{{ (el_kw / 60 - solar_el) if run else 0 }}"
      after: >-
        {{ stored + (heat_kw / 60 if run else 0)
           - (states('input_number.wm_hp_boiler_standby_kwh') | float(1) / 1440 if trigger.id == 'tick' else 0)
           - (trigger.event.data.heat_kwh | float(0) if trigger.id == 'draw' else 0) }}
      backup_el: "{{ [reserve - after, 0] | max / cop }}"
    actions:
      - action: input_number.set_value
        target:
          entity_id: input_number.wm_vb_energy
        data:
          value: "{{ ([after, reserve] | max) | round(5) }}"
      - if:
          - condition: template
            value_template: "{{ solar_el > 0 }}"
        then:
          - action: input_number.set_value
            target:
              entity_id: input_number.wm_vb_solar_kwh
            data:
              value: "{{ (states('input_number.wm_vb_solar_kwh') | float(0) + solar_el) | round(5) }}"
      - if:
          - condition: template
            value_template: "{{ grid_run_el + backup_el > 0 }}"
        then:
          - action: input_number.set_value
            target:
              entity_id: input_number.wm_vb_grid_kwh
            data:
              value: >-
                {{ (states('input_number.wm_vb_grid_kwh') | float(0) + grid_run_el + backup_el) | round(5) }}

  # The add-on publishes start/end messages (not retained) on water_meter/draw.
  - id: wm_draw_started
    alias: "Water usage: draw started"
    mode: single
    triggers:
      - trigger: mqtt
        topic: water_meter/draw
        value_template: "{{ value_json.event }}"
        payload: start
    actions:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.wm_draw_start
        data:
          timestamp: "{{ now().timestamp() }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.wm_draw_gas_start
        data:
          value: "{{ states('sensor.gas_meter_gas') | float(0) }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.wm_draw_gas_baseline
        data:
          value: "{{ [states('sensor.gas_rate') | float(0), 0] | max | round(3) }}"

  # Parallel: the next draw can start during the gas settle delay. Everything
  # this draw needs is captured in variables before the delay.
  - id: wm_draw_finished
    alias: "Water usage: draw finished"
    mode: parallel
    max: 5
    triggers:
      - trigger: mqtt
        topic: water_meter/draw
        value_template: "{{ value_json.event }}"
        payload: end
    variables:
      shower_min_min: 3
      shower_min_l: 15
      toilet_min_l: 4
      toilet_max_l: 12
      toilet_max_min: 3.5
      tap_max_l: 4
      long_draw_min: 30
      draw: "{{ trigger.payload_json }}"
      # HA's time of the start message: identifies the draw and opens its gas window.
      start_ts: "{{ state_attr('input_datetime.wm_draw_start', 'timestamp') | float(0) }}"
      water_start_ts: "{{ as_timestamp(draw.start, 0) }}"
      end_ts: "{{ as_timestamp(draw.end, 0) }}"
      # The start message always comes after the water started; an older one
      # means HA missed it (restart), so the gas start of this draw is unknown.
      start_seen: "{{ start_ts >= water_start_ts - 30 }}"
      # Main run (the shower itself); side water is counted as tap or other.
      volume_l: "{{ draw.main_volume_l | float(0) }}"
      duration_min: "{{ draw.main_duration_min | float(0) }}"
      flowing_min: "{{ draw.main_flowing_min | float(0) }}"
      avg_flow: "{{ draw.main_flow | float(0) | round(1) }}"
      peak_flow: "{{ draw.peak_flow | float(0) | round(1) }}"
      side_l: "{{ draw.side_volume_l | float(0) }}"
      side_min: "{{ draw.side_flowing_min | float(0) }}"
      side_category: "{{ 'tap' if side_l < tap_max_l else 'other' }}"
      # False after a reading gap: the volume is right, the timing a guess.
      complete: "{{ draw.complete | default(true) }}"
      gas_start: "{{ states('input_number.wm_draw_gas_start') | float(0) }}"
      gas_base: "{{ states('input_number.wm_draw_gas_baseline') | float(0) }}"
      # Shower session already running before this draw = second shower.
      in_session: >-
        {{ is_state('input_boolean.bathroom_shower_session', 'on')
           and as_timestamp(states.input_boolean.bathroom_shower_session.last_changed, 0) < water_start_ts }}
    conditions:
      # Meter noise.
      - condition: template
        value_template: "{{ water_start_ts > 946684800 and draw.volume_l | float(0) >= 0.2 }}"
    actions:
      # Humidity detection lags the water by minutes and the DSMR gas value by
      # up to 5 min, so classify and read gas after the settle time.
      - delay:
          minutes: "{{ states('input_number.wm_gas_settle_minutes') | int(10) }}"
      - variables:
          detected_ts: "{{ state_attr('input_datetime.bathroom_shower_detected', 'timestamp') | float(0) }}"
          humid_shower: "{{ water_start_ts - 120 <= detected_ts <= now().timestamp() }}"
          category: >-
            {%- if (humid_shower or in_session) and duration_min >= shower_min_min
                   and volume_l >= shower_min_l -%} shower
            {%- elif toilet_min_l <= volume_l <= toilet_max_l and duration_min <= toilet_max_min -%} toilet
            {%- elif volume_l < tap_max_l -%} tap
            {%- elif duration_min >= long_draw_min -%} long_draw
            {%- else -%} other
            {%- endif -%}
          bucket: "{{ 'other' if category == 'long_draw' else category }}"
          # Litres and running minutes per total (sensor.water_<bucket>_total).
          add_l: >-
            {%- if side_l == 0 or side_category == bucket -%}
              {{ {bucket: (volume_l + side_l) | round(1)} }}
            {%- else -%}
              {{ {bucket: volume_l, side_category: side_l} }}
            {%- endif -%}
          add_flowing_min: >-
            {%- if not complete -%} {}
            {%- elif side_l == 0 or side_category == bucket -%}
              {{ {bucket: (flowing_min + side_min) | round(2)} }}
            {%- else -%}
              {{ {bucket: flowing_min, side_category: side_min} }}
            {%- endif -%}
          add_flowing_l: "{{ add_l if complete else {} }}"
          # A newer draw started: stop this draw's gas window at its start.
          next_start: "{{ state_attr('input_datetime.wm_draw_start', 'timestamp') | float(0) }}"
          gas_end: >-
            {%- if next_start > start_ts -%}
              {{ states('input_number.wm_draw_gas_start') | float(gas_start) }}
            {%- else -%}
              {{ states('sensor.gas_meter_gas') | float(gas_start) }}
            {%- endif -%}
          window_h: >-
            {{ (([next_start, now().timestamp()] | min if next_start > start_ts else now().timestamp())
                - start_ts) / 3600 }}
          gas_m3: >-
            {{ [gas_end - gas_start - gas_base * window_h, 0] | max | round(3) if start_seen else 0 }}
          heat_kwh: >-
            {{ (gas_m3 * states('input_number.wm_gas_kwh_per_m3') | float(9.77)
                * states('input_number.wm_combi_efficiency') | float(85) / 100) | round(2) }}
          # Showers are measured already mixed; other draws via their gas heat.
          v40_l: >-
            {%- if category == 'shower' -%}
              {{ volume_l }}
            {%- else -%}
              {%- set dt = [states('input_number.wm_shower_temp') | float(40)
                            - states('input_number.wm_cold_water_temp') | float(10), 1] | max -%}
              {{ (heat_kwh * 3600 / (4.186 * dt)) | round(1) }}
            {%- endif -%}
          last_hot_end: "{{ state_attr('input_datetime.wm_hot_session_last_end', 'timestamp') | float(0) }}"
          session_v40: >-
            {%- set gap = states('input_number.wm_hot_session_gap_minutes') | float(60) * 60 -%}
            {%- set prev = states('input_number.wm_hot_session_v40') | float(0) -%}
            {{ ((prev if water_start_ts - last_hot_end <= gap else 0) + v40_l) | round(1) }}
      - if:
          - condition: template
            value_template: "{{ v40_l > 0 }}"
        then:
          - action: input_number.set_value
            target:
              entity_id: input_number.wm_hot_session_v40
            data:
              value: "{{ [session_v40, 5000] | min }}"
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.wm_hot_session_last_end
            data:
              timestamp: "{{ end_ts }}"
          - if:
              - condition: template
                value_template: >-
                  {{ session_v40 > states('input_number.wm_hot_peak_session_v40') | float(0) }}
            then:
              - action: input_number.set_value
                target:
                  entity_id: input_number.wm_hot_peak_session_v40
                data:
                  value: "{{ [session_v40, 5000] | min }}"
      - event: water_draw_finished
        event_data:
          category: "{{ category }}"
          start: "{{ as_timestamp(draw.main_start, water_start_ts) | timestamp_local }}"
          end: "{{ as_timestamp(draw.main_end, end_ts) | timestamp_local }}"
          volume_l: "{{ volume_l }}"
          duration_min: "{{ duration_min }}"
          flowing_min: "{{ flowing_min }}"
          avg_flow: "{{ avg_flow }}"
          peak_flow: "{{ peak_flow }}"
          side_category: "{{ side_category if side_l > 0 else 'none' }}"
          side_volume_l: "{{ side_l }}"
          draw_volume_l: "{{ draw.volume_l }}"
          complete: "{{ complete }}"
          add_l: "{{ add_l }}"
          add_flowing_min: "{{ add_flowing_min }}"
          add_flowing_l: "{{ add_flowing_l }}"
          gas_m3: "{{ gas_m3 }}"
          heat_kwh: "{{ heat_kwh }}"
          v40_l: "{{ v40_l }}"
          session_v40_l: "{{ session_v40 if v40_l > 0 else 0 }}"
          heating: "{{ gas_base > 0.05 }}"
      - action: logbook.log
        data:
          name: Water use
          entity_id: sensor.water_last_draw
          message: >-
            {{ category }}: {{ volume_l }} L, water ran {{ flowing_min }} of {{ duration_min }} min
            (avg {{ avg_flow }}, peak {{ peak_flow }} L/min), gas {{ gas_m3 }} m³
