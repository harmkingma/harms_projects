name: Water Meter Reader
version: "0.3.0"
slug: water_meter_reader
description: Reads the dial water meter through the ESPHome ESP32-CAM and publishes it via MQTT.
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
services:
  - mqtt:need
# Read helpers and long-term statistics for the nightly boiler simulation.
homeassistant_api: true
map:
  - type: share
    read_only: false
ingress: true
ingress_port: 8099
panel_icon: mdi:water-pump
panel_title: Water meter
options:
  camera_host: 192.168.68.76
  flash_brightness: 140
  settle_s: 1.5
  interval_s: 30
  flow_interval_s: 10
  draw_gap_s: 120
  keep_rejected: 50
schema:
  camera_host: str
  flash_brightness: int(0,255)
  settle_s: float(0.2,10)
  interval_s: int(10,3600)
  flow_interval_s: int(5,3600)
  draw_gap_s: int(30,1800)
  start_value: float?
  keep_rejected: int(0,1000)
  export_statistic: str?
