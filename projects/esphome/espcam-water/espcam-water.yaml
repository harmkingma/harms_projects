# Phase 2+: ESP32-CAM (AI-Thinker) water meter camera.
# OTA:    esphome run esphome/espcam-water.yaml --device espcam-water.local
# Serial: esphome run esphome/espcam-water.yaml --device COM49   (IO0->GND + RST first)

esphome:
  name: espcam-water
  friendly_name: ESPCam Water
  on_boot:
    priority: -100
    then:
      - script.execute: wifi_watchdog
      - light.turn_on:
          id: flash_led
          brightness: 30%
      - delay: 300ms
      - light.turn_off: flash_led

esp32:
  board: esp32cam
  framework:
    type: esp-idf

psram:

globals:
  - id: last_frame_ms
    type: uint32_t
    initial_value: "0"

logger:
  baud_rate: 115200

api:
  encryption:
    key: !secret api_encryption_key
  # No HA API client by design (add-on uses HTTP); default 15min would reboot forever.
  reboot_timeout: 0s

ota:
  - platform: esphome
    # Reuses the api encryption key.
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Mains powered; modem sleep causes missed beacons/drops on mesh APs.
  power_save_mode: none
  # Pinned to one Deco pod; skip ESPHome's own roam scans.
  post_connect_roaming: false
  on_connect:
    - script.stop: wifi_watchdog
  on_disconnect:
    - script.execute: wifi_watchdog
  ap:
    ssid: "ESPCam-Water Fallback"
    password: !secret fallback_ap_password

captive_portal:

web_server:
  port: 80
  version: 3
  # Firmware updates only via encrypted native OTA (captive portal keeps its own).
  ota: false

debug:
  update_interval: 10s

i2c:
  - id: camera_i2c
    sda: GPIO26
    scl: GPIO27
    frequency: 100kHz
    # Sensor is powered down / unclocked at bus setup, so a scan only adds noise.
    scan: false

esp32_camera:
  name: Meter Camera
  external_clock:
    pin: GPIO0
    frequency: 10MHz
  i2c_id: camera_i2c
  data_pins: [GPIO5, GPIO18, GPIO19, GPIO21, GPIO36, GPIO39, GPIO34, GPIO35]
  vsync_pin: GPIO25
  href_pin: GPIO23
  pixel_clock_pin: GPIO22
  power_down_pin: GPIO32
  # Fixed-focus lens is sharp at ~15 cm; max resolution keeps enough pixels on the meter face.
  resolution: 1600x1200
  jpeg_quality: 10
  frame_buffer_count: 2
  max_framerate: 5 fps
  idle_framerate: 0.2 fps
  on_image:
    - lambda: id(last_frame_ms) = millis();

esp32_camera_web_server:
  - port: 8081
    mode: snapshot
  - port: 8080
    mode: stream

output:
  # Camera owns LEDC timer/channel 0-1, so the flash uses channel 2.
  - platform: ledc
    pin: GPIO4
    id: flash_pwm
    channel: 2
    frequency: 1000Hz
  - platform: gpio
    id: status_led_out
    pin:
      number: GPIO33
      inverted: true

light:
  - platform: monochromatic
    output: flash_pwm
    id: flash_led
    name: Flash LED
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - script.execute: flash_auto_off

script:
  # Safety: the flash LED has no heatsink, never leave it on unattended.
  - id: flash_auto_off
    mode: restart
    then:
      - delay: 15s
      - light.turn_off: flash_led
  # wifi reboot_timeout does not apply while the fallback AP is up.
  - id: wifi_watchdog
    mode: single
    then:
      - delay: 15min
      - if:
          condition:
            not:
              wifi.connected:
          then:
            - logger.log:
                level: ERROR
                format: "WiFi down for 15 min, rebooting"
            - button.press: restart_button

interval:
  # Camera captures continuously at idle_framerate; no frame for 5 min means it stalled.
  - interval: 1min
    then:
      - if:
          condition:
            lambda: return millis() - id(last_frame_ms) > 5 * 60 * 1000;
          then:
            - logger.log:
                level: ERROR
                format: "No camera frame for 5 min, rebooting"
            - button.press: restart_button
  - interval: 1s
    then:
      - output.turn_on: status_led_out
      - delay: 100ms
      - output.turn_off: status_led_out

sensor:
  - platform: wifi_signal
    name: WiFi RSSI
    update_interval: 30s
  - platform: uptime
    name: Uptime
  - platform: debug
    free:
      name: Heap Free
    block:
      name: Heap Max Block
    loop_time:
      name: Loop Time
    psram:
      name: PSRAM Free

text_sensor:
  - platform: wifi_info
    ip_address:
      name: IP Address
    bssid:
      name: Connected BSSID
    mac_address:
      name: MAC Address
  - platform: debug
    device:
      name: Device Info
    reset_reason:
      name: Reset Reason

button:
  - platform: restart
    id: restart_button
    name: Restart
