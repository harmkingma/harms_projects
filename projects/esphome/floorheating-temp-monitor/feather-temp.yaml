# Adafruit ESP32-S2 TFT Feather (product 5300) + 2x DS18B20 on one 1-Wire bus.
# Same pins as the ESP32-S3 TFT Feather (5483): for that board change only `board:` below.
# Wiring: see wiring_diagram.png. Setup: see README.md.

esphome:
  name: feather-temp
  friendly_name: Feather Temp

esp32:
  board: adafruit_feather_esp32s2_tft
  framework:
    type: esp-idf

psram:
  mode: quad          # 2 MB quad PSRAM on this module

logger:

api:
  encryption:
    key: !secret api_key
  reboot_timeout: 0s  # don't reboot every 15 min while no Home Assistant is connected

ota:
  - platform: esphome
    encryption: {}    # reuses the api encryption key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:                 # fallback hotspot, only active when Wi-Fi fails
    ssid: "Feather-Temp"
    password: !secret ap_password

captive_portal:

web_server:           # browse to http://feather-temp.local without Home Assistant
  port: 80
  version: 3
  ota: false          # keep firmware uploads on the encrypted OTA only

one_wire:
  - platform: gpio
    pin: GPIO18       # board pin "A0"

sensor:
  - platform: dallas_temp
    id: temp_1
    name: "Temperature 1"
    # address: 0x0000000000000000   # replace index with the address from the log
    index: 0
    update_interval: 5s
  - platform: dallas_temp
    id: temp_2
    name: "Temperature 2"
    # address: 0x0000000000000000
    index: 1
    update_interval: 5s

spi:
  clk_pin: GPIO36
  mosi_pin: GPIO35

output:
  - platform: ledc
    pin:
      number: GPIO45  # TFT_BACKLITE, fixed by the board design
      ignore_strapping_warning: true
    id: backlight_pwm

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    restore_mode: ALWAYS_ON

font:
  - file: "gfonts://Roboto"
    id: font_label
    size: 16
  - file: "gfonts://Roboto@700"
    id: font_value
    size: 34
    glyphs: "0123456789.-°C "

display:
  - platform: mipi_spi
    model: ST7789V
    cs_pin: GPIO7
    dc_pin: GPIO39
    reset_pin: GPIO40
    enable_pin: GPIO21   # TFT_I2C_POWER, must be high for the TFT
    invert_colors: true
    # color_order: rgb   # uncomment if red/blue appear swapped
    dimensions:
      width: 135
      height: 240
      offset_width: 52
      offset_height: 40
      pad_width: 53
      pad_height: 40
    rotation: 90         # landscape 240x135
    update_interval: 1s
    lambda: |-
      it.fill(Color::BLACK);
      auto row = [&](int y, const char *label, float v, Color c) {
        it.print(8, y, id(font_label), Color(160, 160, 160), label);
        if (isnan(v))
          it.print(8, y + 18, id(font_value), Color(255, 60, 60), "--.-");
        else
          it.printf(8, y + 18, id(font_value), c, "%.1f °C", v);
      };
      row(4,  "Sensor 1", id(temp_1).state, Color(255, 150, 0));
      row(70, "Sensor 2", id(temp_2).state, Color(0, 200, 255));
